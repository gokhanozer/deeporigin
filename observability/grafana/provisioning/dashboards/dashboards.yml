# =============================================================================
# Dashboard provisioning.
#
# Grafana watches this directory and loads any dashboard JSON it finds — at
# startup and then on `updateIntervalSeconds`. That makes provisioning
# **idempotent by construction**: Grafana reconciles the files against its
# database itself, creating what is missing and updating what has changed.
#
# This is why no external "check if the dashboard exists, otherwise create it"
# job is needed. Grafana already does exactly that, natively.
# =============================================================================

apiVersion: 1

providers:
  - name: shortener
    orgId: 1
    # Matches the operational naming used everywhere else — container names
    # (shortener-*), the metric prefix (shortener_*), the Prometheus job and
    # the alert group. An operator reading `shortener_redirect_total` should
    # not have to know the product name to find its dashboard.
    folder: shortener
    type: file
    # Deleting a JSON file removes the dashboard from Grafana too, so the files
    # stay the single source of truth rather than drifting from the UI.
    disableDeletion: false
    updateIntervalSeconds: 30
    # Edits made in the UI are kept until the file changes, so you can iterate
    # live and then export back to the file when happy.
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      # Mirror any sub-directory structure as Grafana folders.
      foldersFromFilesStructure: false
