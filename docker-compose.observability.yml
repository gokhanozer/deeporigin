# =============================================================================
# Observability overlay — Prometheus + Grafana.
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
#   Prometheus → http://localhost:9090   (targets, alerts, raw PromQL)
#   Grafana    → http://localhost:3001   (admin / admin)
#
# Combine with the scaling overlay to watch several replicas at once:
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.scale.yml \
#                  -f docker-compose.observability.yml up -d --scale backend=3
#
# WHY AN OVERLAY: the backend's instrumentation (`/api/v1/metrics`) lives in the
# base image, because exposing metrics is part of the application. The stack
# that *collects* them is infrastructure, and a reviewer running
# `docker compose up` should get an application, not a monitoring platform.
# Same reasoning as docker-compose.scale.yml.
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shortener-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 7 days is ample for a demo and keeps the volume small. Production
      # retention is usually 15–30 days, with long-term storage elsewhere.
      - '--storage.tsdb.retention.time=7d'
      # Needed for the reload endpoint and the alerts UI.
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # PostgreSQL exporter — server-side database metrics
  # ---------------------------------------------------------------------------
  # Connects DIRECTLY to Postgres, never through PgBouncer. It reads session-
  # level `pg_stat_*` views and needs a stable connection to do so; transaction
  # pooling would hand it a different backend between queries and the numbers
  # would be incoherent. Same reasoning as the migration job.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: shortener-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5433}/${POSTGRES_DB}?sslmode=disable
      # Per-table and per-index stats. Cheap at this size; on a database with
      # thousands of tables this is exactly the knob that causes a cardinality
      # explosion, so it is opt-in rather than default.
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: 'false'
    expose:
      - '9187'

  # ---------------------------------------------------------------------------
  # PgBouncer exporter — connection-pool metrics
  # ---------------------------------------------------------------------------
  # Scrapes PgBouncer's admin console. This is the authoritative view of pool
  # saturation — the failure mode PgBouncer exists to prevent, and the one
  # Prisma's own (deprecated) metrics only approximate from the client side.
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.10.2
    container_name: shortener-pgbouncer-exporter
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
    command:
      # The `pgbouncer` database name is virtual — it IS the admin console.
      - --pgBouncer.connectionString=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable
      - --web.listen-address=:9127
    expose:
      - '9127'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: shortener-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Demo credentials. Anything internet-facing needs real ones, and ideally
      # SSO rather than local accounts.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Nobody should be able to self-register on a monitoring tool.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Skip the onboarding wizard; the datasource is already provisioned.
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      # Datasource AND dashboards, provisioned as code. Grafana reconciles this
      # directory against its own database on startup and every 30s — creating
      # what is missing, updating what changed. That is why no external
      # "check-and-create" job is needed: provisioning is idempotent by design.
      #
      # Mounted read-only, so dashboards edited in the UI can be exported back
      # to these files but never silently overwrite them.
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3001, because the frontend owns 3000.
      - '3001:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
