# =============================================================================
# Load balancer in front of the backend replicas.
#
# Exists because a published host port (`4000:4000`) can only be claimed by one
# container — so `--scale backend=3` fails while the backend publishes a port
# itself. nginx takes that port instead and fans requests out across replicas.
# =============================================================================

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS server. Resolving through it — rather than letting
  # nginx cache the address at startup — is what makes scaling up and down take
  # effect without an nginx restart: `backend` resolves to the *current* set of
  # replica IPs, and `valid=5s` bounds how stale that can be.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Logging goes to the container's stdout/stderr so `docker compose logs` works.
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  server {
    listen 4000;

    location / {
      # The hostname must be in a variable. With a literal `proxy_pass
      # http://backend:4000`, nginx resolves once at startup and pins that IP
      # forever — new replicas would never receive traffic, and a replaced
      # container would black-hole requests.
      set $backend_upstream backend:4000;
      proxy_pass http://$backend_upstream;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header Connection        "";

      # The backend's rate limiter and visit analytics both key on the client
      # IP. Without these the real client is invisible and every request would
      # appear to come from this proxy — see ThrottlerProxyGuard and
      # extractClientIp. `trust proxy` in main.ts is set to 1 to match exactly
      # this one-hop chain.
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # A replica that is starting up or shutting down should not fail the
      # request outright — retry it on the next one.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 2s;
    }
  }
}
